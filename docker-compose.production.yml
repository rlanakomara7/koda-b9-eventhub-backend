services:
  frontend:
    build:
      context: ../EventHub/Event-Hub-Rama
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""

    expose:
      - "80"

    restart: unless-stopped

  nginx:
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend
