basePath: /
definitions:
  dto.AuthUserResponse:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  dto.CommunityListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.CommunityResponse'
        type: array
    type: object
  dto.CommunityResponse:
    properties:
      banner_url:
        type: string
      categories:
        items:
          type: string
        type: array
      community_id:
        type: integer
      description:
        type: string
      is_joined:
        type: boolean
      member_count:
        type: integer
      name:
        type: string
      upcoming_count:
        type: integer
    type: object
  dto.CreateEventResponse:
    properties:
      event_id:
        type: integer
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      message:
        type: string
    type: object
  dto.EventCommunityResponse:
    properties:
      community_id:
        type: integer
      name:
        type: string
    type: object
  dto.EventDetailResponse:
    properties:
      availability:
        type: string
      banner_url:
        type: string
      capacity:
        type: integer
      categories:
        items:
          type: string
        type: array
      community:
        $ref: '#/definitions/dto.EventCommunityResponse'
      description:
        type: string
      discussion_count:
        type: integer
      discussions:
        items:
          $ref: '#/definitions/dto.EventDiscussionResponse'
        type: array
      end_time:
        type: string
      event_date:
        type: string
      event_id:
        type: integer
      format:
        type: string
      is_joined:
        type: boolean
      is_saved:
        type: boolean
      location:
        type: string
      organizer:
        $ref: '#/definitions/dto.OrganizerResponse'
      registered:
        type: integer
      speakers:
        items:
          $ref: '#/definitions/dto.EventSpeakerResponse'
        type: array
      spots_left:
        type: integer
      start_time:
        type: string
      title:
        type: string
    type: object
  dto.EventDetailSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.EventDetailResponse'
    type: object
  dto.EventDiscussionResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      discussion_id:
        type: integer
      message:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  dto.EventListNotFoundResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Event'
        type: array
      message:
        type: string
    type: object
  dto.EventListSuccessResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Event'
        type: array
    type: object
  dto.EventSpeakerResponse:
    properties:
      avatar_url:
        type: string
      company:
        type: string
      job:
        type: string
      name:
        type: string
      speaker_id:
        type: integer
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ForgotPasswordResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/dto.AuthUserResponse'
    type: object
  dto.MyEventListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.MyEventResponse'
        type: array
    type: object
  dto.MyEventResponse:
    properties:
      banner_url:
        type: string
      capacity:
        type: integer
      community_id:
        type: integer
      description:
        type: string
      end_time:
        type: string
      event_date:
        type: string
      event_id:
        type: integer
      format:
        type: string
      location:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  dto.OrganizerResponse:
    properties:
      avatar_url:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  dto.ProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      email:
        type: string
      joined_at:
        type: string
      location:
        type: string
      name:
        type: string
      role:
        type: string
      stats:
        $ref: '#/definitions/dto.ProfileStats'
    type: object
  dto.ProfileStats:
    properties:
      communities:
        type: integer
      events:
        type: integer
      saved:
        type: integer
    type: object
  dto.ProfileSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.ProfileResponse'
      message:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ResetPasswordRequest:
    properties:
      email:
        type: string
      new_password:
        minLength: 6
        type: string
      token:
        type: string
    required:
    - email
    - new_password
    - token
    type: object
  dto.Response:
    properties:
      message:
        type: string
    type: object
  models.Event:
    properties:
      banner_url:
        type: string
      capacity:
        type: integer
      community_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      end_time:
        type: string
      event_date:
        type: string
      event_id:
        type: integer
      format:
        type: string
      location:
        type: string
      start_time:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
host: localhost:8500
info:
  contact: {}
  description: Backend for EventHub Application
  title: KODA EventHub API
  version: "1.0"
paths:
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Create reset password token
      parameters:
      - description: Forgot password data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ForgotPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Forgot Password
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login user and generate access token
      parameters:
      - description: Login data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user and Blacklist access token
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Logout
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register Account for new user
      parameters:
      - description: Register data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Register Account
      tags:
      - auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using reset token
      parameters:
      - description: Reset password data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Reset Password
      tags:
      - auth
  /api/communities:
    get:
      description: Get community list with search and category filter
      parameters:
      - description: Search community
        in: query
        name: search
        type: string
      - description: Filter community by category
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CommunityListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Get Communities
      tags:
      - communities
  /api/communities/{id}/join:
    post:
      description: Join community for currently logged in user
      parameters:
      - description: Community ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Join Community
      tags:
      - communities
  /api/communities/{id}/leave:
    delete:
      description: Leave community for currently logged in user
      parameters:
      - description: Community ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Leave Community
      tags:
      - communities
  /api/events:
    get:
      description: Get event list with optional search and format filter
      parameters:
      - description: Search event by title
        in: query
        name: search
        type: string
      - description: 'Filter event format: in_person or online'
        in: query
        name: format
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventListSuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.EventListNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Events
      tags:
      - events
    post:
      consumes:
      - multipart/form-data
      description: Create an event as an organizer with optional banner upload
      parameters:
      - description: Event title
        in: formData
        name: title
        required: true
        type: string
      - description: Description
        in: formData
        name: description
        type: string
      - description: Existing event category name
        in: formData
        name: category
        required: true
        type: string
      - description: Community ID
        in: formData
        name: community_id
        type: integer
      - description: YYYY-MM-DD
        in: formData
        name: event_date
        required: true
        type: string
      - description: HH:MM
        in: formData
        name: start_time
        required: true
        type: string
      - description: HH:MM
        in: formData
        name: end_time
        required: true
        type: string
      - description: online or in_person
        in: formData
        name: format
        required: true
        type: string
      - description: Location
        in: formData
        name: location
        type: string
      - description: Capacity
        in: formData
        name: capacity
        required: true
        type: integer
      - collectionFormat: multi
        description: Speaker names
        in: formData
        items:
          type: string
        name: speakers
        type: array
      - description: Event banner (jpg, jpeg, png, webp, maximum 2MB)
        in: formData
        name: banner
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CreateEventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Create Event
      tags:
      - events
  /api/events/{id}:
    get:
      description: Get event detail by event ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventDetailSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Event Detail
      tags:
      - events
  /api/events/{id}/join:
    post:
      description: Join an event for currently logged in user
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Join Event
      tags:
      - events
  /api/events/{id}/leave:
    delete:
      description: Leave an event for currently logged in user
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Leave Event
      tags:
      - events
  /api/events/my:
    get:
      description: Get events joined by currently logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MyEventListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Get My Events
      tags:
      - events
  /api/events/upcoming:
    get:
      description: Get list of upcoming events
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.EventListSuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get Upcoming Events
      tags:
      - events
  /api/profile:
    get:
      description: Get profile of currently logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Get Profile
      tags:
      - user
    patch:
      consumes:
      - multipart/form-data
      description: Update profile of currently logged in user
      parameters:
      - description: Name
        in: formData
        name: name
        required: true
        type: string
      - description: Location
        in: formData
        name: location
        type: string
      - description: Bio
        in: formData
        name: bio
        type: string
      - description: Avatar
        in: formData
        name: avatar
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProfileSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerToken: []
      summary: Update Profile
      tags:
      - user
securityDefinitions:
  BearerToken:
    description: Bearer Token used as identity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
